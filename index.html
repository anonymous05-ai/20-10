<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chúc mừng 20/10 💐</title>
<meta name="description" content="Thiệp chúc mừng Ngày Phụ nữ Việt Nam 20/10 – lá thư viết riêng cho bạn">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
<style>
  :root {
    --wine: #4a0b27; --plum: #7a1442; --rose: #e8567f; --rose-deep: #b32d5c;
    --blush: #ffd9e4; --gold: #f1cf8b; --paper: #fffaf6;
    --w: 320px; --h: 230px; --v: 132px;
    --ease-out: cubic-bezier(.22, 1, .36, 1);
    --ease-io: cubic-bezier(.65, 0, .35, 1);
    --serif: 'Playfair Display', Georgia, serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    overflow: hidden;
    font-family: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
    color: var(--blush);
    background:
      radial-gradient(1200px 700px at 50% 110%, #a3194f 0%, transparent 60%),
      radial-gradient(900px 600px at 15% -10%, #6b1240 0%, transparent 60%),
      linear-gradient(160deg, var(--wine), #2c0618 100%);
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; }

  .glow { position: fixed; border-radius: 50%; filter: blur(70px); opacity: .45; pointer-events: none; will-change: transform; }
  .glow.a { width: 380px; height: 380px; background: #ff5c93; top: -100px; left: -80px; animation: drift 18s var(--ease-io) infinite alternate; }
  .glow.b { width: 420px; height: 420px; background: #c2185b; bottom: -140px; right: -100px; animation: drift 22s var(--ease-io) infinite alternate-reverse; }
  @keyframes drift { to { transform: translate3d(70px, 50px, 0) scale(1.15); } }

  canvas#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
  body.scene-on canvas#fx { z-index: 50; }

  /* ---------- Lớp màn hình ---------- */
  .layer {
    position: fixed; inset: 0; z-index: 5; padding: 16px;
    display: grid; place-items: center; overflow: auto;
    transition: opacity .8s ease, transform .9s var(--ease-out), filter .8s ease, visibility 0s;
  }
  .layer.off { opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .8s ease, transform .9s var(--ease-out), filter .8s ease, visibility 0s .8s; }
  #gate.off  { transform: translateY(-24px) scale(.96); filter: blur(8px); }
  #stage.off { transform: translateY(40px) scale(.94); filter: blur(6px); }
  #stage { overflow: hidden; }

  /* ---------- Thẻ nhập thông tin ---------- */
  .card {
    width: min(100%, 400px); padding: 30px 26px 26px; text-align: center;
    border-radius: 26px;
    background: linear-gradient(160deg, rgba(255,255,255,.14), rgba(255,255,255,.05));
    border: 1px solid rgba(255,255,255,.22);
    box-shadow: 0 30px 70px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.25);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  }
  .card > * { animation: rise .9s var(--ease-out) both; animation-delay: calc(var(--i, 0) * .09s + .1s); }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); filter: blur(5px); } to { opacity: 1; transform: none; filter: none; } }
  .card.shake { animation: shake .5s var(--ease-out); }
  @keyframes shake { 20%,60% { transform: translateX(-7px); } 40%,80% { transform: translateX(7px); } }

  .badge {
    width: 68px; height: 68px; margin: 0 auto 14px; border-radius: 50%;
    display: grid; place-items: center; font-size: 32px;
    background: radial-gradient(circle at 35% 30%, #ffe9b0, var(--gold) 50%, #c9954a);
    box-shadow: 0 0 0 0 rgba(241,207,139,.5), 0 8px 20px rgba(0,0,0,.3);
    animation: rise .9s var(--ease-out) both, halo 2.6s ease-out infinite 1s;
  }
  @keyframes halo { to { box-shadow: 0 0 0 26px rgba(241,207,139,0), 0 8px 20px rgba(0,0,0,.3); } }
  .card h2 { margin: 0 0 8px; font: italic 600 29px/1.2 var(--serif); color: #fff; }
  .card .sub { margin: 0 0 22px; font-size: 14px; line-height: 1.6; color: rgba(255,217,228,.85); }
  .lbl { display: block; margin: 0 0 8px; text-align: left; font-size: 13px; font-weight: 500; color: var(--blush); }
  .field { margin-bottom: 18px; }

  input#name {
    width: 100%; padding: 14px 16px; border-radius: 14px; font: inherit; font-size: 16px; color: #fff;
    background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.25); outline: none;
    transition: border-color .25s, box-shadow .25s, background .25s;
  }
  input#name::placeholder { color: rgba(255,255,255,.45); }
  input#name:focus { border-color: var(--gold); background: rgba(255,255,255,.14); box-shadow: 0 0 0 4px rgba(241,207,139,.2); }

  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .chip {
    position: relative; display: flex; align-items: center; justify-content: center; gap: 10px;
    height: 56px; padding: 0 12px; cursor: pointer; border-radius: 16px;
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.25);
    transition: transform .35s var(--ease-out), background .3s, border-color .3s, box-shadow .3s;
  }
  .chip:hover { transform: translateY(-2px); background: rgba(255,255,255,.14); }
  .chip:active { transform: scale(.97); }
  .chip:focus-visible, .btn:focus-visible, .ghost:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  .tick { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.55); display: grid; place-items: center; transition: background .3s, border-color .3s, transform .45s var(--ease-out); }
  .tick svg { width: 14px; height: 14px; fill: none; stroke: var(--wine); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 24; stroke-dashoffset: 24; transition: stroke-dashoffset .4s ease .1s; }
  .chip.on { background: linear-gradient(135deg, rgba(255,107,152,.55), rgba(232,86,127,.4)); border-color: var(--gold); box-shadow: 0 8px 24px rgba(232,86,127,.35); }
  .chip.on .tick { background: var(--gold); border-color: var(--gold); transform: scale(1.12); }
  .chip.on .tick svg { stroke-dashoffset: 0; }

  .err { min-height: 20px; margin: 0 0 10px; font-size: 13px; color: #ffb3c8; }

  .btn {
    position: relative; width: 100%; padding: 15px; border: 0; cursor: pointer; overflow: hidden;
    border-radius: 999px; font-weight: 600; font-size: 16px; color: #fff;
    background: linear-gradient(135deg, #ff6b98, var(--rose) 50%, #c93a67);
    box-shadow: 0 10px 30px rgba(232,86,127,.5);
    transition: transform .35s var(--ease-out), box-shadow .35s;
  }
  .btn::after { content: ""; position: absolute; top: 0; left: -60%; width: 40%; height: 100%; background: linear-gradient(100deg, transparent, rgba(255,255,255,.45), transparent); transform: skewX(-20deg); animation: shine 3.2s ease-in-out infinite 1.5s; }
  @keyframes shine { 0% { left: -60%; } 40%,100% { left: 130%; } }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 16px 38px rgba(232,86,127,.6); }
  .btn:active { transform: scale(.98); }

  /* ---------- Phong bì ---------- */
  .scene { position: relative; transition: transform 1.2s var(--ease-out); transform: scale(var(--k, 1)); }
  .scene.is-out { transform: translateY(calc(70px * var(--k, 1))) scale(var(--k, 1)); }

  .envelope {
    position: relative; width: var(--w); height: var(--h); perspective: 1100px; cursor: pointer; outline: none;
    animation: float 5s ease-in-out infinite; filter: drop-shadow(0 30px 40px rgba(0,0,0,.45));
  }
  .back, .pocket, .seam, .to, .flap { transition-property: opacity, transform, z-index; }
  .scene.is-front .envelope { animation-play-state: paused; }
  
  @keyframes float { 0%,100% { transform: translateY(0) rotate(-.6deg); } 50% { transform: translateY(-9px) rotate(.6deg); } }

  .back { position: absolute; inset: 0; z-index: 1; border-radius: 6px 6px 12px 12px; background: linear-gradient(180deg, #a82a55, #8f2048); }

  .letter {
    position: absolute; z-index: 2; left: 20px; bottom: 10px; width: calc(var(--w) - 40px); height: 210px; padding: 18px 22px 14px;
    background: radial-gradient(circle at 100% 0, rgba(241,207,139,.28), transparent 42%), linear-gradient(180deg, #fffdfb, var(--paper));
    border-radius: 6px; color: var(--plum); text-align: center;
    display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 7px;
    box-shadow: 0 2px 8px rgba(0,0,0,.18); transform-origin: 50% 100%; will-change: transform;
    transition: transform 1.1s var(--ease-out), box-shadow 1s ease;
  }
  .letter::before { content: ""; position: absolute; inset: 7px; border: 1px solid rgba(214,169,86,.55); border-radius: 4px; pointer-events: none; }
  .scene.is-slide .letter { transform: translateY(-130px); transition-duration: 1s; transition-timing-function: var(--ease-io); }
  .scene.is-front .letter { z-index: 10; transform: translateY(-176px) scale(1.14); box-shadow: 0 30px 60px rgba(0,0,0,.4), 0 0 0 1px rgba(255,255,255,.4); }

  .flower { font-size: 22px; line-height: 1; }
  .letter h1 { margin: 0; font: italic 600 22px/1.2 var(--serif); color: var(--plum); overflow-wrap: anywhere; }
  .letter p { margin: 0; font-size: 12.6px; line-height: 1.6; color: #6b2a48; }
  .sign { font: italic 600 14px var(--serif); color: var(--rose-deep); }

  .reveal, .w { opacity: 0; transform: translateY(10px); filter: blur(3px); transition: opacity .8s ease, transform .8s var(--ease-out), filter .8s ease; }
  .w { display: inline-block; transition-delay: var(--d, 0s); }
  .scene.is-front .reveal, .scene.is-front .w { opacity: 1; transform: none; filter: none; }
  .scene.is-front .flower { transition-delay: .35s; }
  .scene.is-front .letter h1 { transition-delay: .55s; }

  .pocket {
    position: absolute; inset: 0; z-index: 3; pointer-events: none; border-radius: 6px 6px 12px 12px;
    clip-path: polygon(0 0, 50% var(--v), 100% 0, 100% 100%, 0 100%);
    background: linear-gradient(180deg, #f0638c, var(--rose) 55%, #db4a76);
  }
  .pocket::before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(120,15,60,.22), transparent 55%, rgba(120,15,60,.22)); }
  .pocket::after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, rgba(255,255,255,.18), transparent 35%); }
  .seam { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; }
  .seam line { stroke: rgba(255,255,255,.35); stroke-width: 1.2; }
  .to { position: absolute; z-index: 3; left: 16px; right: 16px; bottom: 24px; text-align: center; pointer-events: none; font: italic 600 18px/1.2 var(--serif); color: rgba(255,255,255,.95); text-shadow: 0 1px 8px rgba(120,15,60,.5); overflow-wrap: anywhere; }

  .flap { position: absolute; left: 0; top: 0; z-index: 4; width: 100%; height: var(--v); transform-origin: 50% 0; transition: transform .85s var(--ease-io), z-index 0s .38s; }
  .flap i { position: absolute; inset: 0; display: block; clip-path: polygon(0 0, 100% 0, 50% 100%); background: linear-gradient(180deg, #ff7aa0, var(--rose) 70%, #d9457a); transition: background .3s ease .3s; }
  .scene.is-open .flap { transform: rotateX(180deg); z-index: 1; }
  .scene.is-open .flap i { background: linear-gradient(0deg, #8f2048, #a82a55); }

  .seal {
    position: absolute; z-index: 6; left: 50%; top: calc(var(--v) - 24px); width: 48px; height: 48px; margin-left: -24px; padding: 0;
    border-radius: 50%; border: 0; cursor: pointer; display: grid; place-items: center; font-size: 22px;
    background: radial-gradient(circle at 35% 30%, #ffe9b0, var(--gold) 45%, #c9954a 100%);
    box-shadow: 0 4px 12px rgba(0,0,0,.35), inset 0 -3px 6px rgba(120,70,10,.35);
    transition: transform .55s var(--ease-out), opacity .4s ease; animation: beat 1.8s ease-in-out infinite;
  }
  .seal:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
  @keyframes beat { 0%,100% { transform: scale(1); } 15% { transform: scale(1.12); } 30% { transform: scale(1); } 45% { transform: scale(1.08); } }
  .scene.is-open .seal { transform: scale(2.2) rotate(25deg); opacity: 0; pointer-events: none; animation: none; }

  .hint { position: absolute; left: 50%; top: calc(var(--h) + 38px); width: 100%; text-align: center; font-size: 14px; color: var(--blush); transition: opacity .4s ease; animation: nudge 2s ease-in-out infinite; }
  .scene.is-open .hint { opacity: 0; animation: none; }
  @keyframes nudge { 0%,100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, 5px); } }

  .actions { position: absolute; left: 50%; top: calc(var(--h) + 76px); display: flex; gap: 10px; white-space: nowrap; transform: translateX(-50%); opacity: 0; pointer-events: none; transition: opacity .6s ease; }
  .actions.show { opacity: 1; pointer-events: auto; }
  .ghost { padding: 10px 20px; cursor: pointer; border-radius: 999px; font-size: 13.5px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.35); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); transition: background .2s, transform .3s var(--ease-out); }
  .ghost:hover { background: rgba(255,255,255,.22); transform: translateY(-2px); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
  }
</style>
</head>
<body>
  <div class="glow a"></div><div class="glow b"></div>
  <canvas id="fx" aria-hidden="true"></canvas>

  <!-- Bước 1: nhập tên + hỏi gia đình -->
  <section class="layer" id="gate">
    <form class="card" id="card" novalidate>
      <div class="badge" style="--i:0">💐</div>
      <h2 style="--i:1">Một lá thư dành riêng cho bạn</h2>
      <p class="sub" style="--i:2">Cho mình biết đôi điều nhỏ để lời chúc được viết đúng với bạn.</p>

      <div class="field" style="--i:3">
        <label class="lbl" for="name">Tên của bạn</label>
        <input id="name" type="text" maxlength="24" placeholder="Ví dụ: Lan Anh" autocomplete="off" enterkeyhint="go">
      </div>

      <div class="field" style="--i:4">
        <span class="lbl" id="q">Bạn đã có gia đình chưa?</span>
        <div class="choices" role="radiogroup" aria-labelledby="q">
          <button type="button" class="chip" role="radio" aria-checked="false" data-v="married">
            <span class="tick"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>Có rồi 💍
          </button>
          <button type="button" class="chip" role="radio" aria-checked="false" data-v="single">
            <span class="tick"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>Chưa 🌸
          </button>
        </div>
      </div>

      <p class="err" id="err" role="alert" style="--i:5"></p>
      <button type="submit" class="btn" style="--i:6">Nhận thư 💌</button>
    </form>
  </section>

  <!-- Bước 2: phong bì + lá thư -->
  <section class="layer off" id="stage">
    <main class="scene" id="scene">
      <div class="envelope" id="envelope" role="group" aria-label="Phong bì thư chúc mừng 20/10">
        <div class="back"></div>
        <article class="letter">
          <div class="flower reveal" id="flower">💐</div>
          <h1 class="reveal" id="greet"></h1>
          <p id="msg"></p>
          <div class="sign reveal" id="sign"></div>
        </article>
        <div class="pocket"></div>
        <svg class="seam" viewBox="0 0 320 230" preserveAspectRatio="none" aria-hidden="true"><line x1="0" y1="0" x2="160" y2="132"/><line x1="320" y1="0" x2="160" y2="132"/></svg>
        <div class="to" id="to"></div>
        <div class="flap"><i></i></div>
        <button class="seal" id="seal" aria-label="Mở thư">❤️</button>
      </div>
      <div class="hint" id="hint">Chạm vào dấu niêm phong để mở thư</div>
      <div class="actions" id="actions">
        <button class="ghost" id="again">Xem lại</button>
        <button class="ghost" id="change">Đổi người nhận</button>
      </div>
    </main>
  </section>

<script>
(() => {
  /* ✏️ SỬA LỜI CHÚC Ở ĐÂY (mỗi nhóm có vài mẫu, mỗi lần mở sẽ chọn ngẫu nhiên) */
  const WISHES = {
    married: {
      flower: '🌹', sign: 'Với tất cả lòng biết ơn ♥',
      msgs: [
        'Chúc mừng 20/10! Chúc bạn luôn là ngọn lửa ấm của gia đình, được yêu thương, trân trọng và có thật nhiều phút giây bình yên bên người thân.',
        'Chúc mừng 20/10! Cảm ơn bạn đã dịu dàng gánh vác cả một mái ấm. Chúc bạn luôn khỏe, luôn cười và được chăm sóc như cách bạn chăm sóc mọi người.',
        'Chúc mừng 20/10! Mong căn nhà của bạn luôn tràn tiếng cười, và bạn luôn có thời gian dành cho chính mình. Bạn xứng đáng được nâng niu.'
      ],
      palette: ['#ff9ab8', '#ff6b98', '#e8567f', '#f1cf8b', '#ffd1df']
    },
    single: {
      flower: '🌸', sign: 'Với tất cả yêu thương ♥',
      msgs: [
        'Chúc mừng 20/10! Chúc bạn luôn xinh đẹp, tự tin và tỏa sáng theo cách riêng. Mong mọi điều bạn mơ ước sẽ nở rộ như hoa mùa xuân.',
        'Chúc mừng 20/10! Chúc bạn sống thật rực rỡ, yêu bản thân thật nhiều và sớm gặp người trân trọng bạn đúng như bạn xứng đáng.',
        'Chúc mừng 20/10! Chúc bạn tuổi trẻ thật đẹp, đi thật xa, cười thật nhiều và luôn được bao quanh bởi những điều dịu dàng.'
      ],
      palette: ['#ffb3c8', '#ff8fb0', '#d9a8ff', '#ffd1df', '#f7a8c4']
    }
  };

  const $ = id => document.getElementById(id);
  const body = document.body, scene = $('scene'), envelope = $('envelope');
  const gate = $('gate'), stage = $('stage'), card = $('card'), input = $('name'), err = $('err');
  const chips = [...document.querySelectorAll('.chip')];
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let choice = null, name = '', busy = false, opened = false, timers = [];
  const later = (fn, ms) => timers.push(setTimeout(fn, reduce ? 0 : ms));

  const fit = () => scene.style.setProperty('--k', Math.max(.6, Math.min(1, (innerWidth - 32) / 360, (innerHeight - 40) / 660)));
  fit(); addEventListener('resize', fit);

  /* ----- Chọn "Có rồi / Chưa" ----- */
  chips.forEach(c => c.addEventListener('click', () => {
    choice = c.dataset.v;
    chips.forEach(x => { const on = x === c; x.classList.toggle('on', on); x.setAttribute('aria-checked', on); });
    err.textContent = '';
    setPalette(WISHES[choice].palette);
  }));
  input.addEventListener('input', () => err.textContent = '');

  const fail = msg => {
    err.textContent = msg;
    card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
  };

  card.addEventListener('submit', e => {
    e.preventDefault();
    name = input.value.replace(/\s+/g, ' ').trim()
      .split(' ').map(w => w.charAt(0).toLocaleUpperCase('vi') + w.slice(1)).join(' ');
    if (!name) return fail('Hãy nhập tên của bạn nhé.');
    if (!choice) return fail('Hãy chọn "Có rồi" hoặc "Chưa" nhé.');
    personalize();
    gate.classList.add('off');
    input.blur();
    later(() => { stage.classList.remove('off'); body.classList.add('scene-on'); }, 450);
    later(open, 1500);   // thư tự mở, người nhận không cần bấm thêm
  });

  /* ----- Viết lá thư theo tên + lựa chọn ----- */
  function personalize() {
    const data = WISHES[choice];
    const msg = data.msgs[Math.floor(Math.random() * data.msgs.length)];
    const len = name.length;
    $('flower').textContent = data.flower;
    $('greet').textContent = 'Gửi ' + name + ',';
    $('greet').style.fontSize = len > 18 ? '16px' : len > 12 ? '19px' : '22px';
    $('to').textContent = 'Gửi ' + name;
    $('to').style.fontSize = len > 18 ? '14px' : len > 12 ? '16px' : '18px';
    $('hint').textContent = 'Thư này dành riêng cho ' + name + ' – chạm vào dấu niêm phong để mở';

    const p = $('msg'); p.textContent = '';
    const words = msg.split(' ');
    words.forEach((w, i) => {
      const s = document.createElement('span');
      s.className = 'w'; s.textContent = w; s.style.setProperty('--d', (0.95 + i * 0.045).toFixed(2) + 's');
      p.appendChild(s); p.appendChild(document.createTextNode(' '));
    });
    $('sign').textContent = data.sign;
    $('sign').style.transitionDelay = (0.95 + words.length * 0.045 + 0.2).toFixed(2) + 's';
  }

  /* ----- Mở thư ----- */
  function open() {
    if (busy || opened) return;
    busy = opened = true;
    scene.classList.add('is-open');
    later(() => scene.classList.add('is-slide'), 650);
    later(() => { scene.classList.add('is-out', 'is-front'); burst(80); }, 1500);
    later(() => burst(45), 2050);
    later(() => { $('actions').classList.add('show'); busy = false; }, 3600);
  }
  function reset() {
    timers.forEach(clearTimeout); timers = [];
    scene.classList.remove('is-open', 'is-slide', 'is-out', 'is-front');
    $('actions').classList.remove('show');
    busy = opened = false;
  }
  $('seal').addEventListener('click', e => { e.stopPropagation(); open(); });
  envelope.addEventListener('click', open);
  $('again').addEventListener('click', () => { if (!busy) reset(); });
  $('change').addEventListener('click', () => {
    if (busy) return;
    reset();
    stage.classList.add('off'); body.classList.remove('scene-on');
    setTimeout(() => { gate.classList.remove('off'); input.focus({ preventScroll: true }); input.select(); }, reduce ? 0 : 500);
  });

  /* ---------- Canvas: sao lấp lánh, cánh hoa, trái tim ---------- */
  const cv = $('fx'), ctx = cv.getContext('2d');
  let W, H, dpr, stars = [];
  const rand = (a, b) => a + Math.random() * (b - a);
  const size = () => {
    dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    stars = Array.from({ length: reduce ? 0 : (W < 600 ? 35 : 70) }, () => ({ x: rand(0, W), y: rand(0, H), r: rand(.6, 1.8), ph: rand(0, 6.28), sp: rand(.01, .03) }));
  };
  size(); addEventListener('resize', size);

  let palette = ['#ffb3c8', '#ff8fb0', '#ff6b98', '#ffd1df', '#f7a8c4'];
  const parts = [];
  function setPalette(p) { palette = p; parts.forEach(q => { if (!q.burst && !q.heart) q.color = p[(Math.random() * p.length) | 0]; }); }

  function make(x, y, burst) {
    const a = rand(0, 6.283), s = burst ? rand(4, 14) : 0, heart = burst && Math.random() < .25;
    return {
      x, y, vx: burst ? Math.cos(a) * s : rand(-.3, .3), vy: burst ? Math.sin(a) * s - 6 : rand(.5, 1.3),
      size: rand(7, burst ? 15 : 12), rot: heart ? rand(-.4, .4) : rand(0, 6.28), vr: heart ? rand(-.01, .01) : rand(-.05, .05),
      sway: rand(0, 6.28), swaySpd: rand(.01, .03), color: palette[(Math.random() * palette.length) | 0],
      heart, spark: burst && !heart && Math.random() < .25,
      life: burst ? rand(180, 300) : Infinity, age: 0, burst, alpha: burst ? 1 : rand(.3, .65)
    };
  }
  const ambient = reduce ? 0 : (innerWidth < 600 ? 14 : 26);
  for (let i = 0; i < ambient; i++) parts.push(make(rand(0, W), rand(-H, H), false));

  function burst(n) {
    if (reduce) return;
    const r = envelope.getBoundingClientRect();
    for (let i = 0; i < n; i++) parts.push(make(r.left + r.width / 2, r.top + r.height / 2 - 90, true));
  }

  function draw(p) {
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.globalAlpha = Math.max(0, p.alpha);
    const s = p.size;
    if (p.heart) {
      ctx.fillStyle = '#ff5c8a'; ctx.beginPath();
      ctx.moveTo(0, s * .8); ctx.bezierCurveTo(-s * 1.2, -s * .1, -s * .6, -s * .9, 0, -s * .3);
      ctx.bezierCurveTo(s * .6, -s * .9, s * 1.2, -s * .1, 0, s * .8); ctx.fill();
    } else if (p.spark) {
      const k = s * .5; ctx.fillStyle = '#ffe9b0'; ctx.beginPath();
      ctx.moveTo(0, -k); ctx.quadraticCurveTo(0, 0, k, 0); ctx.quadraticCurveTo(0, 0, 0, k);
      ctx.quadraticCurveTo(0, 0, -k, 0); ctx.quadraticCurveTo(0, 0, 0, -k); ctx.fill();
    } else {
      ctx.fillStyle = p.color; ctx.beginPath(); ctx.moveTo(0, -s);
      ctx.bezierCurveTo(s * .9, -s * .6, s * .8, s * .6, 0, s);
      ctx.bezierCurveTo(-s * .8, s * .6, -s * .9, -s * .6, 0, -s); ctx.fill();
    }
    ctx.restore();
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(2, (now - last) / 16.67); last = now;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    for (const st of stars) {            // sao nhấp nháy
      st.ph += st.sp * dt;
      ctx.globalAlpha = .15 + .55 * Math.abs(Math.sin(st.ph));
      ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, 6.283); ctx.fill();
    }
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.sway += p.swaySpd * dt;
      if (p.burst) {
        p.vx *= Math.pow(.972, dt); p.vy = p.vy * Math.pow(.972, dt) + .12 * dt; p.age += dt;
        if (p.age > p.life * .6) p.alpha -= .012 * dt;
        if (p.age > p.life || p.alpha <= 0 || p.y > H + 30) { parts.splice(i, 1); continue; }
      }
      p.x += (p.vx + Math.sin(p.sway) * .6) * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
      if (!p.burst && p.y > H + 20) { p.y = -20; p.x = rand(0, W); }
      draw(p);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
